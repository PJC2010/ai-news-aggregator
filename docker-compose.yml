name: ai-news-aggregator

x-backend: &backend
  image: ai-news-aggregator-backend:local
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://news:news@postgres:5432/news
    REDIS_URL: redis://redis:6379/0
  volumes:
    - models:/models
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: news
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]

  seed:
    <<: *backend
    command: ["ai-news", "seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.tasks:celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    <<: *backend
    command: ["celery", "-A", "app.workers.tasks:celery_app", "beat", "--loglevel=info", "--schedule=/state/celerybeat-schedule"]
    volumes:
      - beat:/state
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres:
  models:
  beat:
