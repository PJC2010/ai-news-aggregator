[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-news-aggregator"
version = "0.3.0"
description = "AI news intelligence: shared summaries, structured analysis, and ranking"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "alembic>=1.14,<2",
  "celery[redis]>=5.4,<6", "httpx[socks]>=0.27,<1", "feedparser>=6,<7",
  "trafilatura>=2,<3", "numpy>=1.26,<3", "pydantic-settings>=2.6,<3"
]

[project.optional-dependencies]
local = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[project.scripts]
ai-news = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["sources.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["postgres: requires TEST_DATABASE_URL pointing to a disposable Postgres database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
