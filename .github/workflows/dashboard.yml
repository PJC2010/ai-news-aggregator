name: Dashboard verification
on: [push, pull_request]

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install real backend for browser integration tests
        run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements.lock
          .venv/bin/pip install -e './backend[dev]'
      - run: npm ci
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test -- --workers=2
        working-directory: frontend
      - name: Preserve failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-traces
          path: frontend/test-results
          retention-days: 7
      - name: Build dashboard container
        run: docker build --tag ai-news-dashboard:ci frontend
      - name: Check dashboard container permissions
        run: >-
          docker run --rm --entrypoint node ai-news-dashboard:ci -e
          "if (process.getuid() !== 10001) process.exit(1)"
